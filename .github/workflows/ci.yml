name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # store 包的 4000 行 DAL 测试挂在 TEST_MYSQL_DSN 上：不设这个变量时它们整包 skip，
    # CI 一路绿灯却一行 SQL 都没跑过——这正是"本地绿、线上炸"的典型来源。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laborlaw
        ports:
          - "3306:3306"
        # mysql:8.0 首启（初始化 datadir + 建库）要 20 秒以上；
        # health 没绿之前 job 不会开始，retries 给小了会直接判服务不可用。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # loc=UTC 与服务端一致：store 的 COUNT/TIMESTAMP 断言按 UTC 写。
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/laborlaw?parseTime=true&charset=utf8mb4&loc=UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 格式检查必须在 build 之前：gofmt 不通过说明提交前没跑 make fmt，
      # 这类问题不拦下来会一路漂到 review 阶段。
      - name: gofmt
        run: |
          out=$(gofmt -l internal cmd)
          if [ -n "$out" ]; then
            echo "以下文件未格式化:"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -race 在 CI 跑而不是本地：Windows 上 race detector 需要 gcc，
      # 而 ubuntu runner 天然有。
      - name: test
        run: go test -race -count=1 ./...

      - name: coverage
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1

  # 前端单测用 `node --test` 直接跑 .ts（靠 Node 的类型擦除），
  # 所以 node-version 必须 24：22.x 以下不认 .ts 扩展名，会直接报官方不支持。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile：lock 与 package.json 不一致就失败，
      # 免得 CI 悄悄装出与本地不同的依赖树。
      - name: install
        run: pnpm install --frozen-lockfile

      - name: test
        run: pnpm test

      # build 里带 vue-tsc -b，类型错会在这里拦下来（项目没有 eslint，不新增）。
      - name: build
        run: pnpm build

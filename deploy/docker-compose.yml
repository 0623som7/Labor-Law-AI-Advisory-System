# 本地与演示环境的单机编排：MySQL + Redis + api。
#
# 内存按 4 核 4G 机型设定（2G 机型见 docs/冲刺计划_1个月.md §1 与 runbook §1.1）：
#   MySQL buffer pool 512M + 容器硬限 1G、Redis maxmemory 128M、api 容器硬限 512M、开 swap。
# 这里只做资源上限，swap 必须在宿主机上手工开——容器内开 swap 不生效。
services:
  mysql:
    # 镜像里带着 my.cnf（见 ./mysql/Dockerfile）：bind mount 与 configs 在
    # Windows 上都落成 0777，会被 MySQL 当成 world-writable 配置文件静默忽略。
    build:
      context: ./mysql
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-laborlaw_root}
      MYSQL_DATABASE: laborlaw
      TZ: Asia/Shanghai
    command: ["--defaults-extra-file=/etc/mysql/conf.d/my.cnf"]
    volumes:
      - mysql-data:/var/lib/mysql
    # 不映射 3306 到宿主机：本机通常已经装了 MySQL，映射会撞端口。
    # 需要连库调试时用 `docker compose exec mysql mysql -uroot -p`。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 只发布到宿主 loopback：本机直接 go run 的 api 用 .env 里的 REDIS_ADDR=127.0.0.1:6379，
    # 不发布这个端口时 api 连不上、/readyz 里只有 mysql（缓存与限流降级）。
    # 绑 127.0.0.1 而不是 0.0.0.0：Redis 无密码，暴露到公网等于把库交给别人。
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 国内构建机走官方代理会 TLS 超时（storage.googleapis.com）。
        # 需要时 GOPROXY=https://goproxy.cn,direct docker compose build
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # 快速失败：忘记设 APP_ENV 时不让容器起来，而不是默默按 dev 跑。
      # dev 下 requireAuth 认 AUTH_DEV_USER 就把任何请求当成同一个用户，
      # 线上出现这种状态等于所有人共用 dev-user-0001。
      APP_ENV: ${APP_ENV:?APP_ENV 必须显式设置（dev / staging / production）}
      # .env 是开发机用的，里面有 AUTH_DEV_USER=dev-user-0001、AUTO_MIGRATE=true。
      # env_file 会把它整份注进来，而 config.Validate 只在 production 下拦 DevUser——
      # 也就是说 staging 部署会悄悄保留"不带令牌就被当成 dev-user-0001"的后门。
      # 这两行按部署语义强制盖掉：鉴权只认令牌，迁移必须显式执行。
      AUTH_DEV_USER: ""
      AUTO_MIGRATE: "false"
      # 容器内 poppler-utils 装在 PATH 里，直接写可执行名即可。
      # .env 里那个路径是宿主机 Windows 用的，注进来会让容器去执行一个不存在的文件。
      FILE_PDFTOTEXT_PATH: pdftotext
      # 容器里必须用服务名，.env 里的 127.0.0.1 是宿主机视角。
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-laborlaw_root}@tcp(mysql:3306)/laborlaw?parseTime=true&charset=utf8mb4&loc=UTC"
      REDIS_ADDR: "redis:6379"
    ports:
      # 只绑 loopback：公网只该看到 nginx 的 8443，8080 留给本机 curl 调试。
      - "127.0.0.1:8080:8080"
    volumes:
      - ../storage:/app/storage
    healthcheck:
      # 用 readyz 而不是 healthz：容器要等依赖真的可用才算就绪。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # TLS 终止层：公网 8443 -> api:8080。证书在宿主机的 deploy/nginx/certs/ 下，
  # 按 runbook §3.5 生成；不进仓库（见 deploy/nginx/certs/.gitignore）。
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # 自签证书对容器内的 wget 不友好：--no-check-certificate 跳过校验，
      # 只看端口是否在应答（证书本身在 runbook §3.5 用 openssl 验）。
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M

  # 一次性法条导入。用 profile 隔离，默认 `up` 不会启动它——
  # 它的工作是把 statutes 表整个删掉重建（ReplaceAll），混进默认启动等于每次起服务都清一遍表。
  # 用法：docker compose --profile seed run --rm seed（跑完即退，restart: "no"）。
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    profiles: ["seed"]
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV 必须显式设置（dev / staging / production）}
      # 与 api 同源：用 root 是因为 statutes 表由 api 的迁移建、没有单独的业务账号。
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-laborlaw_root}@tcp(mysql:3306)/laborlaw?parseTime=true&charset=utf8mb4&loc=UTC"
    # -source 指到 HTML 原文目录（不是 /app/seed 本身：sources 里写的是文件名，
    # 解析器把它们和 -source 拼在一起读）；-out 指到镜像内那份可写的拷贝，
    # 因为 WORKDIR=/app 下的默认相对路径是 deploy/seed/statutes.json，容器里没有这个目录。
    entrypoint: ["/app/statuteseed", "-import", "-source", "/app/seed/source", "-out", "/app/seed/statutes.json"]
    restart: "no"

volumes:
  mysql-data:
  redis-data:

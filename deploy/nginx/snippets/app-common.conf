# 两个 TLS server 块共用的 server 级设置（443 域名入口与 8443 IP 兜底）。
# 只做搬家：这些指令原来写在同一个 server 块里，拆块后必须两边都有，
# 否则 8443 会丢掉 12MB 上传上限与 300s 超时，IP 直连演示时上传合同直接 413。

# 与 api 的 HTTP_MAX_BODY_BYTES 对齐（12MB）：合同 PDF 走这个口上传，
# 这里先拦一道，别让大包在 nginx 与 Go 之间白跑一遍。
client_max_body_size 12m;

# 上传大文件与长咨询都靠这个：nginx 默认 60s 收不到响应就断。
proxy_connect_timeout 10s;
proxy_send_timeout    300s;
proxy_read_timeout    300s;

root  /usr/share/nginx/html;
index index.html;

# 首屏最大的两个文件是 pdf.worker.min（1.38MB）与 pdfjs（328KB），
# 不压缩就是 1.7MB 明文走公网，2C2G 小机器上 TLS 握手之后要传好几秒——
# 观众第一次进审查页等的那 7 秒，大头在这里。
#
# gzip_types 里必须显式列 application/javascript：nginx 默认只压 text/html，
# 不写这条 .js/.mjs 一律不压（默认列表里没有 application/javascript）。
# 不列 text/event-stream —— SSE 在 app-locations.conf 的 location /api/ 里已经 gzip off。
# gzip_min_length 取 256 而不是常见的 1024：入口 index.html 只有 710B，
# 卡在 1024 就不压，观众拿到的首屏 HTML 仍是明文。
# gzip_vary 让 CDN/浏览器按 Accept-Encoding 分别缓存，否则中间层可能把压缩版发给不支持的客户端。
gzip              on;
gzip_vary         on;
gzip_min_length   256;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml application/javascript
                  application/json application/xml application/wasm
                  image/svg+xml;

# 两个 TLS server 块共用的全部 location（443 域名入口与 8443 IP 兜底）。
# 只做搬家：内容与原 server 块逐字相同，改这里等于同时改两个入口。

# 探针在 /healthz、/readyz，不在 /api 前缀下，必须是精确匹配，
# 否则会被下面的 try_files 兜成 index.html，容器健康检查恒 200 但毫无意义。
location ~ ^/(healthz|readyz)$ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
}

# /metrics 含今日花费与在线人数，不对公网开放。
# 必须显式给 404：否则被 location / 的 try_files 兜成 index.html，返回 200 HTML，
# 监控脚本拿到 HTML 会当成"指标正常"。
location = /metrics { return 404; }

location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;          # SSE 必须关，否则攒满缓冲才吐
    proxy_cache off;
    chunked_transfer_encoding on;
    # SSE 不许压：gzip 要攒够一块才能出，等于把"边生成边吐"变成"憋一屏再吐"，
    # 首字延迟从 0.68s 涨到整段生成完。app-common.conf 里的 gzip on 会继承到这里，
    # 必须显式关掉。
    #
    # 代价：这个 location 里的 JSON 响应（/statutes 检索 1.7KB、/reviews 列表）
    # 也不压了。实测 /statutes?q=…&top_k=3 是 1717 字节，压不压差 1KB 上下，
    # 不值得为它单独开一个 location 去赌 SSE 不被压——SSE 一旦被压，整条链路
    # 的"边生成边显示"就没了，那是演示的核心观感。
    gzip off;
}

# 构建产物带内容 hash，可以长缓存；入口 HTML 不能缓存，
# 否则发版后老用户拿到的还是旧 index.html，引用的 JS 文件名已不存在。
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
}

location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# pdf.worker 是 ES module（.mjs），nginx 默认 mime.types 不认这个扩展名，
# 会退回 application/octet-stream；Chrome 对 module worker 严格校验 MIME，
# 结果是 PDF 一律渲染失败，页面只显示一句加载错误。
# 本地 vite dev 自己发正确 MIME，所以这个问题在本地永远测不出来。
#
# 正则 location 的优先级高于前缀 location /assets/，缓存头必须自己再写一遍，
# 不会从上面继承。types { } 清空本 location 的类型表，由 default_type 兜底。
# 用 ~* 而不是 ~：扩展名大小写不敏感。
location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

# 8443 同时承担前端静态站点与 /api/ 反代；443 是域名入口。
#
# 两套证书必须分成两个 server 块：
#   443 —— Let's Encrypt 公信证书，域名访问不再提示"不是私密连接"；
#   8443 —— 自签证书（SAN 含 IP），IP 直连兜底。IP 直连不带 SNI，
#           nginx 只能按端口给默认证书，所以不能与 443 共用一对证书。
#
# location 与 server 级公共指令抽到 nginx/snippets/ 下，两个块 include 同一份，
# 避免两份配置日后漂移（比如只在 443 加了新缓存头，IP 兜底却漏了）。
#
# 前端 dist 不入库（web/.gitignore 忽略），部署时按 runbook §3.6 上传到 web/dist，
# 由 compose 只读挂载到 /usr/share/nginx/html。
#
# 证书不进仓库（见 certs/.gitignore）：自签证书按 runbook §3.5 在机器上生成；
# Let's Encrypt 证书由 certbot 签发后复制进来（runbook「证书」一节）。

# 80 只做两件事：跳 https，以及给 Let's Encrypt 的 HTTP-01 校验让路。
#
# 301 必须写在 location / 里面，不能写在 server 级：server 级的 return 跑在
# rewrite 阶段，早于 location 选择，会让 acme-challenge 那条 location 永远进不去
# （实测 curl 仍是 301）。放进 location / 之后，^~ 前缀的 acme 分支优先命中、
# 由 try_files 直接吐文件。
server {
    listen 80;
    server_name laborlaw-ai.cn www.laborlaw-ai.cn;

    location ^~ /.well-known/acme-challenge/ {
        # 宿主机 /opt/laborlaw/deploy/acme 只读挂进来；certbot --webroot 往宿主机写，
        # 容器只读即可（nginx 不需要写 acme 目录）。
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443：域名入口，Let's Encrypt 公信证书。
server {
    listen 443 ssl;
    server_name laborlaw-ai.cn www.laborlaw-ai.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/app-common.conf;
    include /etc/nginx/snippets/app-locations.conf;
}

# 8443：IP 直连兜底，自签证书。答辩当天域名/公信证书出问题时退回这里。
server {
    listen 8443 ssl;
    # 8443 只服务 IP 直连兜底：客户端不带 SNI 时 nginx 用该端口的默认证书，
    # 所以这里必须挂自签（SAN 含 IP），不能用 443 的 Let's Encrypt 证书。
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/app-common.conf;
    include /etc/nginx/snippets/app-locations.conf;
}

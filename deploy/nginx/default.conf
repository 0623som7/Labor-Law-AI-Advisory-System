# 8443 同时承担两件事：给公网提供前端静态站点，并把 /api/ 反向代理到 api:8080。
#
# 分成两个 location 的原因：
#   /api/ 走代理，SSE 必须关缓冲（否则攒满缓冲区才下发，前端看到"想很久突然刷一屏"）；
#   /     走本地文件，前端是 history 路由，刷新 /chat 这种深链接要回退到 index.html，
#         否则 nginx 会按路径找文件、404。
#
# 前端 dist 不入库（web/.gitignore 忽略），部署时按 runbook §3.6 上传到 web/dist，
# 由 compose 只读挂载到 /usr/share/nginx/html。
#
# 证书不进仓库（见 certs/.gitignore）：自签证书按 runbook §3.5 在机器上生成。
server {
    listen 8443 ssl;
    # 自签证书同样要写协议与套件：默认配置在部分发行版里仍允许 TLS1.0。
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 与 api 的 HTTP_MAX_BODY_BYTES 对齐（12MB）：合同 PDF 走这个口上传，
    # 这里先拦一道，别让大包在 nginx 与 Go 之间白跑一遍。
    client_max_body_size 12m;

    # 上传大文件与长咨询都靠这个：nginx 默认 60s 收不到响应就断。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    root  /usr/share/nginx/html;
    index index.html;

    # 探针在 /healthz、/readyz，不在 /api 前缀下，必须是精确匹配，
    # 否则会被下面的 try_files 兜成 index.html，容器健康检查恒 200 但毫无意义。
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }

    # /metrics 含今日花费与在线人数，不对公网开放。
    # 必须显式给 404：否则被 location / 的 try_files 兜成 index.html，返回 200 HTML，
    # 监控脚本拿到 HTML 会当成"指标正常"。
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;          # SSE 必须关，否则攒满缓冲才吐
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 构建产物带内容 hash，可以长缓存；入口 HTML 不能缓存，
    # 否则发版后老用户拿到的还是旧 index.html，引用的 JS 文件名已不存在。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

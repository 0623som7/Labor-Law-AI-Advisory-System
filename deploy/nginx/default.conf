# 8443 同时承担两件事：给公网提供前端静态站点，并把 /api/ 反向代理到 api:8080。
#
# 分成两个 location 的原因：
#   /api/ 走代理，SSE 必须关缓冲（否则攒满缓冲区才下发，前端看到"想很久突然刷一屏"）；
#   /     走本地文件，前端是 history 路由，刷新 /chat 这种深链接要回退到 index.html，
#         否则 nginx 会按路径找文件、404。
#
# 前端 dist 不入库（web/.gitignore 忽略），部署时按 runbook §3.6 上传到 web/dist，
# 由 compose 只读挂载到 /usr/share/nginx/html。
#
# 证书不进仓库（见 certs/.gitignore）：自签证书按 runbook §3.5 在机器上生成。
# 80 只做一件事：跳 https。备案通过后 80 必须能应答。
server {
    listen 80;
    server_name laborlaw-ai.cn www.laborlaw-ai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    # 8443 保留给 IP 直连（答辩兜底，证书 SAN 里仍留着 IP）。
    # 443 才是域名入口：浏览器按 SNI 选证书，两个 listen 共用同一张叶证书。
    listen 443 ssl;
    server_name laborlaw-ai.cn www.laborlaw-ai.cn;
    # 自签证书同样要写协议与套件：默认配置在部分发行版里仍允许 TLS1.0。
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 与 api 的 HTTP_MAX_BODY_BYTES 对齐（12MB）：合同 PDF 走这个口上传，
    # 这里先拦一道，别让大包在 nginx 与 Go 之间白跑一遍。
    client_max_body_size 12m;

    # 上传大文件与长咨询都靠这个：nginx 默认 60s 收不到响应就断。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    root  /usr/share/nginx/html;
    index index.html;

    # 首屏最大的两个文件是 pdf.worker.min（1.38MB）与 pdfjs（328KB），
    # 不压缩就是 1.7MB 明文走公网，2C2G 小机器上 TLS 握手之后要传好几秒——
    # 观众第一次进审查页等的那 7 秒，大头在这里。
    #
    # gzip_types 里必须显式列 application/javascript：nginx 默认只压 text/html，
    # 不写这条 .js/.mjs 一律不压（默认列表里没有 application/javascript）。
    # 不列 text/event-stream —— SSE 在下面 location /api/ 里已经 gzip off。
    # gzip_min_length 取 256 而不是常见的 1024：入口 index.html 只有 710B，
    # 卡在 1024 就不压，观众拿到的首屏 HTML 仍是明文。
    # gzip_vary 让 CDN/浏览器按 Accept-Encoding 分别缓存，否则中间层可能把压缩版发给不支持的客户端。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml application/wasm
                      image/svg+xml;

    # 探针在 /healthz、/readyz，不在 /api 前缀下，必须是精确匹配，
    # 否则会被下面的 try_files 兜成 index.html，容器健康检查恒 200 但毫无意义。
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
    }

    # /metrics 含今日花费与在线人数，不对公网开放。
    # 必须显式给 404：否则被 location / 的 try_files 兜成 index.html，返回 200 HTML，
    # 监控脚本拿到 HTML 会当成"指标正常"。
    location = /metrics { return 404; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;          # SSE 必须关，否则攒满缓冲才吐
        proxy_cache off;
        chunked_transfer_encoding on;
        # SSE 不许压：gzip 要攒够一块才能出，等于把"边生成边吐"变成"憋一屏再吐"，
        # 首字延迟从 0.68s 涨到整段生成完。上面 server 级的 gzip on 会继承到这里，
        # 必须显式关掉。
        #
        # 代价：这个 location 里的 JSON 响应（/statutes 检索 1.7KB、/reviews 列表）
        # 也不压了。实测 /statutes?q=…&top_k=3 是 1717 字节，压不压差 1KB 上下，
        # 不值得为它单独开一个 location 去赌 SSE 不被压——SSE 一旦被压，整条链路
        # 的"边生成边显示"就没了，那是演示的核心观感。
        gzip off;
    }

    # 构建产物带内容 hash，可以长缓存；入口 HTML 不能缓存，
    # 否则发版后老用户拿到的还是旧 index.html，引用的 JS 文件名已不存在。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # pdf.worker 是 ES module（.mjs），nginx 默认 mime.types 不认这个扩展名，
    # 会退回 application/octet-stream；Chrome 对 module worker 严格校验 MIME，
    # 结果是 PDF 一律渲染失败，页面只显示一句加载错误。
    # 本地 vite dev 自己发正确 MIME，所以这个问题在本地永远测不出来。
    #
    # 正则 location 的优先级高于前缀 location /assets/，缓存头必须自己再写一遍，
    # 不会从上面继承。types { } 清空本 location 的类型表，由 default_type 兜底。
    # 用 ~* 而不是 ~：扩展名大小写不敏感。
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

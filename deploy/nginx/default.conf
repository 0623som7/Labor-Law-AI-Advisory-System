# 8443 的 TLS 反向代理：公网只看到这一个端口，api 只在宿主机 loopback 上 listen。
#
# 三处与"默认 nginx"不同的地方，都是为了本系统的 SSE 咨询接口：
#   proxy_buffering off —— 开着的 nginx 会攒够缓冲区才下发，前端看到的是"想很久突然刷一屏"，
#                          心跳与逐字输出都会失效；
#   proxy_read_timeout  —— 默认 60s，一次长咨询（多路检索 + 长回答）会被掐成 502；
#   Connection ''       —— 清掉客户端带来的 Connection 头，配合 http_version 1.1 走 keep-alive，
#                          否则每个 SSE 连接都要重新握手。
#
# 证书不进仓库（见 certs/.gitignore）：自签证书按 runbook §3.5 在机器上生成。
server {
    listen 8443 ssl;
    # 自签证书同样要写协议与套件：默认配置在部分发行版里仍允许 TLS1.0。
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 与 api 的 HTTP_MAX_BODY_BYTES 对齐（12MB）：合同 PDF 走这个口上传，
    # 这里先拦一道，别让大包在 nginx 与 Go 之间白跑一遍。
    client_max_body_size 12m;

    # 上传大文件与长咨询都靠这个：nginx 默认 60s 收不到响应就断。
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;          # SSE 必须关，否则攒满缓冲才吐
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
